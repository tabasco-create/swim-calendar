name: Update filtered swim calendar

on:
  schedule:
    - cron: "17 13 * * *"     # daily, ~6am Pacific
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # lets the keep-alive step reset GitHub's 60-day inactivity timer

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python filter_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          # Ignore DTSTAMP-only churn so we don't commit every run
          if git diff --cached -I '^DTSTAMP' --quiet; then
            echo "No real changes"
          else
            git commit -m "Update swim calendar"
            git push
          fi

      - name: Keep schedule alive
        # GitHub disables scheduled workflows after 60 days of repo inactivity. Re-enabling the
        # workflow on every run resets that timer, so the daily schedule never lapses.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml || echo "Could not re-enable (harmless)."
