name: Update filtered swim calendar

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python filter_calendar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          # Ignore DTSTAMP-only churn so we don't commit every run
          if git diff --cached -I '^DTSTAMP' --quiet; then
            echo "No real changes"
          else
            git commit -m "Update swim calendar"
            git push
          fi
